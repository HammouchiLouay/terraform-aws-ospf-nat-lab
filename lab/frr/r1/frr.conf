frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface r12
 ip ospf cost 10
!
interface r13
 ip ospf cost 50
!
router ospf
 ospf router-id 1.1.1.1
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
 network 192.168.10.0/24 area 0
 passive-interface lan0
!
line vty
!
